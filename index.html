<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sound Visualizer — 3D Audio Analysis</title>
  <style>
    :root {
      --bg-primary: #0a0a1a;
      --bg-secondary: #12122a;
      --bg-panel: #1a1a2e;
      --bg-hover: #252545;
      --text-primary: #e0e0f0;
      --text-secondary: #8888aa;
      --accent: #4287f5;
      --accent-glow: rgba(66, 135, 245, 0.3);
      --danger: #ff4444;
      --success: #44ff88;
      --border: #2a2a4a;
      --radius: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Header / Toolbar */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      backdrop-filter: blur(10px);
    }

    .toolbar-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar-divider {
      width: 1px;
      height: 28px;
      background: var(--border);
    }

    .app-title {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #4287f5, #42f5a7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-right: 8px;
    }

    /* Buttons */
    .btn {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn:hover { background: var(--bg-hover); border-color: var(--accent); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); border-color: var(--accent); }
    .btn-primary:hover { background: #5a9fff; }
    .btn-danger { border-color: var(--danger); color: var(--danger); }
    .btn-danger:hover { background: rgba(255, 68, 68, 0.15); }

    .btn-icon {
      width: 32px;
      height: 32px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    /* File input */
    .file-input-label {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #file-input { display: none; }
    #file-name {
      font-size: 13px;
      color: var(--text-secondary);
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Time display */
    .time-display {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 14px;
      color: var(--text-secondary);
      min-width: 100px;
      text-align: center;
    }
    .time-display span { color: var(--text-primary); }

    /* Volume */
    .volume-control {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    input[type="range"] {
      -webkit-appearance: none;
      width: 80px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
    }

    /* Selection info */
    #selection-info {
      display: none;
      font-size: 12px;
      color: var(--accent);
      padding: 3px 8px;
      background: var(--accent-glow);
      border-radius: 4px;
    }

    /* Progress bar */
    #progress-container {
      display: none;
      width: 100%;
      height: 3px;
      background: var(--bg-primary);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 200;
    }
    #progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--success));
      transition: width 0.1s;
      border-radius: 0 2px 2px 0;
    }

    /* Drop zone */
    #drop-zone {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      z-index: 50;
      transition: all 0.3s;
    }
    #drop-zone.active {
      background: rgba(66, 135, 245, 0.08);
    }
    .drop-zone-content {
      text-align: center;
      padding: 60px;
      border: 2px dashed var(--border);
      border-radius: 20px;
      max-width: 500px;
      transition: border-color 0.3s;
    }
    #drop-zone.active .drop-zone-content {
      border-color: var(--accent);
    }
    .drop-icon {
      font-size: 64px;
      margin-bottom: 20px;
      opacity: 0.3;
    }
    .drop-title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .drop-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }
    .drop-formats {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Main content */
    #main-content { display: none; }

    /* Viz container — full page for 3D */
    #viz-container {
      padding: 0;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 48px);
    }

    /* Panel styles */
    .viz-panel {
      background: var(--bg-primary);
      overflow: hidden;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .viz-panel-3d {
      flex: 1;
    }

    .viz-panel-header {
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .viz-panel-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .viz-canvas-container {
      width: 100%;
      flex: 1;
      min-height: 0;
    }
    .viz-canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .viz-three-container {
      flex: 1;
      min-height: 0;
    }

    /* Band controls */
    .band-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .band-btn {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 3px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-family: inherit;
      transition: all 0.15s;
    }
    .band-btn:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }
    .band-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .rotate-btn.active {
      background: rgba(66, 135, 245, 0.3);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .toolbar { padding: 6px 8px; gap: 6px; }
      .btn { padding: 4px 8px; font-size: 12px; }
      .band-btn { padding: 2px 6px; font-size: 10px; }
    }
  </style>
</head>
<body>

<div id="progress-container"><div id="progress-bar"></div></div>

<!-- Toolbar -->
<div class="toolbar">
  <span class="app-title">SoundViz 3D</span>

  <div class="toolbar-section">
    <label class="btn file-input-label" for="file-input">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
      Open
    </label>
    <input type="file" id="file-input" accept="audio/*,.wav,.mp3,.ogg,.flac,.aac,.m4a,.wma,.aiff">
    <span id="file-name">No file loaded</span>
  </div>

  <div class="toolbar-divider"></div>

  <div class="toolbar-section">
    <button class="btn btn-icon" id="btn-skip-back" title="Return to start">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="btn btn-icon btn-primary" id="btn-play" title="Play/Pause (Space)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="btn btn-icon" id="btn-stop" title="Stop">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"/></svg>
    </button>
  </div>

  <div class="time-display">
    <span id="time-current">0:00</span> / <span id="time-total">0:00</span>
  </div>

  <div class="toolbar-divider"></div>

  <div class="toolbar-section volume-control">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
  </div>

  <div class="toolbar-divider"></div>

  <div class="toolbar-section">
    <button class="btn" id="btn-crop" title="Crop to selection">Crop</button>
    <button class="btn btn-danger" id="btn-delete-sel" title="Delete selection">Delete</button>
    <button class="btn" id="btn-separate" title="Harmonic/Percussive separation">Separate</button>
    <button class="btn" id="btn-denoise" title="Spectral gate noise reduction">Denoise</button>
    <button class="btn" id="btn-export" title="Export as WAV (Ctrl+E)">Export WAV</button>
  </div>

  <span id="selection-info"></span>
</div>

<!-- Drop Zone -->
<div id="drop-zone">
  <div class="drop-zone-content">
    <div class="drop-icon">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
    </div>
    <div class="drop-title">Drop an audio file here</div>
    <div class="drop-subtitle">or click to browse</div>
    <label class="btn btn-primary" for="file-input" style="display:inline-flex; cursor:pointer; padding: 10px 24px; font-size: 14px;">
      Choose Audio File
    </label>
    <div class="drop-formats" style="margin-top: 20px;">
      Supports: WAV, MP3, OGG, FLAC, AAC, M4A, AIFF, WMA
    </div>
  </div>
</div>

<!-- Main Content -->
<div id="main-content">
  <div id="viz-container"></div>
</div>

<!-- Meyda (audio feature extraction) -->
<script src="https://cdn.jsdelivr.net/npm/meyda@5.4.2/dist/web/meyda.min.js"></script>

<!-- Import map for ES modules -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module" src="js/app.js"></script>

</body>
</html>
